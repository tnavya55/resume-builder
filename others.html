<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Builder - Others</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial, sans-serif;
}

.navbar{
  background:#3f51b5;
  color:#fff;
  padding:15px 30px;
  font-size:20px;
}

.container{
  width:80%;
  margin:40px auto;
  background:#fff;
  padding:30px;
  border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
  color:#333;
  margin-bottom:20px;
}

textarea{
  width:100%;
  height:120px;
  padding:10px;
  font-size:16px;
  border-radius:4px;
  border:1px solid #ccc;
  resize:none;
}

.buttons{
  display:flex;
  justify-content:space-between;
  margin-top:30px;
}

button{
  padding:10px 25px;
  border:none;
  border-radius:4px;
  font-size:16px;
  cursor:pointer;
}

.back{
  background:#9e9e9e;
  color:white;
}

.download{
  background:#4caf50;
  color:white;
}
</style>
</head>

<body>

<div class="navbar">
  Resume Builder – Others
</div>

<div class="container">
  <h2>Other Details</h2>

  <textarea id="others"
    placeholder="Certifications, Achievements, Languages, Strengths..."></textarea>

  <div class="buttons">
    <button class="back" type="button" onclick="goBack()">Back</button>
    <button class="download" type="button" onclick="downloadPDF()">Download PDF</button>
  </div>
</div>

<!-- PDF library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  // Load saved others data
  window.onload = function () {
    const saved = localStorage.getItem("others");
    if (saved) {
      document.getElementById("others").value = saved;
    }
  };

  function saveOthers() {
    localStorage.setItem(
      "others",
      document.getElementById("others").value
    );
  }

  function goBack() {
    saveOthers();
    window.location.href = "/hobbies.html";
  }

  function downloadPDF() {
    saveOthers();

    const personal   = JSON.parse(localStorage.getItem("personal"))   || {};
    const education  = JSON.parse(localStorage.getItem("education"))  || {};
    const projects   = JSON.parse(localStorage.getItem("projects"))   || {};
    const experience = JSON.parse(localStorage.getItem("experience")) || {};
    const hobbies    = localStorage.getItem("hobbies") || "";
    const others     = localStorage.getItem("others") || "";

    const resume = document.createElement("div");
    resume.style.padding = "20px";
    resume.style.fontFamily = "Arial";

    resume.innerHTML = `
      <h1>${personal.fname || ""} ${personal.lname || ""}</h1>
      <p>
        ${personal.email || ""} |
        ${personal.phone || ""}
      </p>
      <hr>

      <h2>Education</h2>
      <p><strong>${education.college || ""}</strong></p>
      <p>${education.college_qualification || ""}</p>
      <p>${education.college_desc || ""}</p>

      <h2>Projects</h2>
      <p><strong>${projects.p1title || ""}</strong></p>
      <p>${projects.p1desc || ""}</p>

      <h2>Experience</h2>
      <p><strong>${experience.company || ""}</strong></p>
      <p>${experience.role || ""}</p>
      <p>${experience.work || ""}</p>

      <h2>Hobbies</h2>
      <p>${hobbies}</p>

      <h2>Other Details</h2>
      <p>${others}</p>
    `;

    html2pdf().from(resume).save("My_Resume.pdf");
  }
</script>

</body>

</html>
