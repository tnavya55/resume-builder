<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Builder - Projects</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial, sans-serif;
}

/* HEADER */
.header{
  background:#3f51b5;
  color:#fff;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  margin:0;
  font-size:20px;
}

/* CARD */
.container{
  width:70%;
  margin:40px auto;
  background:#fff;
  padding:30px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  border-radius:4px;
}

.container h3{
  text-align:center;
  border-bottom:1px solid #ddd;
  padding-bottom:10px;
  margin-bottom:25px;
}

/* FORM ROWS */
.row{
  display:flex;
  gap:20px;
  margin-bottom:20px;
}

.input-box{
  width:100%;
}

.input-box label{
  font-size:14px;
  display:block;
  margin-bottom:5px;
}

input, textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:4px;
  font-size:14px;
}

textarea{
  height:90px;
  resize:none;
}

/* BUTTONS */
.buttons{
  margin-top:30px;
  text-align:center;
}

button{
  background:#e91e63;
  color:#fff;
  border:none;
  padding:10px 25px;
  border-radius:4px;
  cursor:pointer;
  margin:0 10px;
}

button:hover{
  opacity:0.9;
}

.page{
  text-align:center;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>Resume Builder</h2>
  <span>LOGIN</span>
</div>

<!-- CARD -->
<div class="container">
  <h3>Projects Developed</h3>

  <!-- PROJECT 1 -->
  <h4>Project 1</h4>
  <div class="row">
    <div class="input-box">
      <label>Project Title *</label>
      <input type="text" id="p1title">
    </div>

    <div class="input-box">
      <label>Project Link</label>
      <input type="text" id="p1link">
    </div>
  </div>

  <div class="row">
    <div class="input-box">
      <label>Description *</label>
      <textarea id="p1desc"></textarea>
    </div>
  </div>

  <!-- PROJECT 2 -->
  <h4>Project 2</h4>
  <div class="row">
    <div class="input-box">
      <label>Project Title</label>
      <input type="text" id="p2title">
    </div>

    <div class="input-box">
      <label>Project Link</label>
      <input type="text" id="p2link">
    </div>
  </div>

  <div class="row">
    <div class="input-box">
      <label>Description</label>
      <textarea id="p2desc"></textarea>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="buttons">
    <button id="backBtn">&lt; BACK</button>
    <button id="nextBtn">NEXT &gt;</button>
  </div>

  <div class="page">Page 3</div>
</div>

<script>
/* LOAD DATA */
window.onload = function () {
  const data = JSON.parse(localStorage.getItem("projects")) || {};

  p1title.value = data.p1title || "";
  p1link.value = data.p1link || "";
  p1desc.value = data.p1desc || "";

  p2title.value = data.p2title || "";
  p2link.value = data.p2link || "";
  p2desc.value = data.p2desc || "";
};

/* SAVE FUNCTION */
function saveProjects() {
  const projectData = {
    p1title: p1title.value,
    p1link: p1link.value,
    p1desc: p1desc.value,
    p2title: p2title.value,
    p2link: p2link.value,
    p2desc: p2desc.value
  };

  localStorage.setItem("projects", JSON.stringify(projectData));
}

/* BACK */
document.getElementById("backBtn").onclick = function () {
  saveProjects();
  window.location.href = "/education.html";
};

/* NEXT */
document.getElementById("nextBtn").onclick = function () {
  saveProjects();
window.location.href = "/experience.html";
};
</script>

</body>

</html>
