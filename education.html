<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Builder - Education</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h2>Resume Builder</h2>
  <span>LOGIN</span>
</div>

<div class="card">
  <h3>Education Details</h3>

  <div class="grid">
    <div class="input-group"><input id="college" type="text" placeholder="College / University *" required><span>🎓</span></div>
    <div class="input-group"><input id="college_from" type="text" placeholder="dd-mm-yyyy" required><span>📅</span></div>
    <div class="input-group"><input id="college_to" type="text" placeholder="dd-mm-yyyy" required><span>📅</span></div>
  </div>

  <div class="grid-2">
    <div class="input-group"><input id="college_qualification" type="text" placeholder="Qualification *" required></div>
    <div class="input-group"><input id="college_desc" type="text" placeholder="Description *" required></div>
  </div>

  <div class="grid">
    <div class="input-group"><input id="school" type="text" placeholder="School *" required><span>🎓</span></div>
    <div class="input-group"><input id="school_from" type="text" placeholder="dd-mm-yyyy" required><span>📅</span></div>
    <div class="input-group"><input id="school_to" type="text" placeholder="dd-mm-yyyy" required><span>📅</span></div>
  </div>

  <div class="grid-2">
    <div class="input-group"><input id="school_qualification" type="text" placeholder="Qualification *" required></div>
    <div class="input-group"><input id="school_desc" type="text" placeholder="Description *" required></div>
  </div>

  <div class="buttons">
    <button class="back" onclick="window.location.href='index.html'">Back</button>
    <button class="next" type="button">NEXT</button>
  </div>

  <div class="page">Page 2</div>
</div>

<script>
window.onload = function(){
  const edu = JSON.parse(localStorage.getItem("education")) || {};
  Object.keys(edu).forEach(key=>{
    if(document.getElementById(key)) document.getElementById(key).value = edu[key];
  });
};

document.querySelector(".next").onclick = function(){
  const fields = ["college","college_from","college_to","college_qualification","college_desc",
                  "school","school_from","school_to","school_qualification","school_desc"];
  for(let id of fields){
    const input = document.getElementById(id);
    if(!input.checkValidity()){ input.reportValidity(); return; }
  }
  const eduData = {};
  fields.forEach(id => eduData[id] = document.getElementById(id).value);
  localStorage.setItem("education", JSON.stringify(eduData));
  window.location.href = "project.html";
};
</script>
</body>
</html>
