<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Builder - Experience</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial, sans-serif;
}
.header{
  background:#3f51b5;
  color:#fff;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.container{
  width:70%;
  margin:40px auto;
  background:#fff;
  padding:30px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.container h3{
  text-align:center;
  border-bottom:1px solid #ddd;
  padding-bottom:10px;
}
.row{
  display:flex;
  gap:20px;
  margin-top:20px;
}
input, textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:4px;
}
textarea{
  height:90px;
}
.buttons{
  margin-top:30px;
  text-align:center;
}
button{
  background:#e91e63;
  color:#fff;
  border:none;
  padding:10px 25px;
  border-radius:4px;
  cursor:pointer;
  margin:0 10px;
}
.page{
  text-align:center;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
  <h2>Resume Builder</h2>
  <span>LOGIN</span>
</div>

<div class="container">
  <h3>Experience Details</h3>

  <form>

    <div class="row">
      <input type="text" id="company" placeholder="Company Name *" required>
      <input type="text" id="role" placeholder="Job Role *" required>
    </div>

    <div class="row">
      <input type="date" id="startDate" required>
      <input type="date" id="endDate">
    </div>

    <div class="row">
      <textarea id="workDesc" placeholder="Work Description *" required></textarea>
    </div>

    <div class="buttons">
      <button type="button" id="backBtn">&lt; BACK</button>
      <button type="button" id="nextBtn">NEXT</button>
    </div>

    <div class="page">Page 4</div>

  </form>
</div>

<script>
/* LOAD SAVED DATA */
window.onload = function () {
  const data = JSON.parse(localStorage.getItem("experience")) || {};

  company.value = data.company || "";
  role.value = data.role || "";
  startDate.value = data.startDate || "";
  endDate.value = data.endDate || "";
  workDesc.value = data.workDesc || "";
};

/* SAVE FUNCTION */
function saveExperience() {
  const expData = {
    company: company.value,
    role: role.value,
    startDate: startDate.value,
    endDate: endDate.value,
    workDesc: workDesc.value
  };
  localStorage.setItem("experience", JSON.stringify(expData));
}

/* BACK BUTTON */
document.getElementById("backBtn").onclick = function () {
  saveExperience();
  window.location.href = "project.html";
};

/* NEXT BUTTON */
document.getElementById("nextBtn").onclick = function () {
  saveExperience();
  window.location.href = "hobbies.html";
};
</script>

</body>

</html>
