<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Resume</title>
</head>

<body>

<h1 id="name"></h1>

<ul>
  <li id="email"></li>
  <li><a id="website" target="_blank"></a></li>
  <li><a id="github" target="_blank"></a></li>
  <li><a id="linkedin" target="_blank"></a></li>
  <li><a id="twitter" target="_blank"></a></li>
  <li><a id="facebook" target="_blank"></a></li>
  <li><a id="instagram" target="_blank"></a></li>
</ul>

<!-- Download button -->
<button id="downloadBtn">Download Resume PDF</button>

<!-- PDF library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
const personal = JSON.parse(localStorage.getItem("personal"));

// Validate required fields
if (!personal || !personal.fname || !personal.lname || !personal.email) {
  alert("Required personal details missing!");
  // Redirect back to personal input page
  window.location.href = "index.html";
} else {
  document.getElementById("name").innerText =
    (personal.fname || "") + " " + (personal.lname || "");
  document.getElementById("email").innerText = personal.email || "";

  setLink("website", personal.website);
  setLink("github", personal.github);
  setLink("linkedin", personal.linkedin);
  setLink("twitter", personal.twitter);
  setLink("facebook", personal.facebook);
  setLink("instagram", personal.instagram);
}

function setLink(id, value) {
  if (value) {
    const el = document.getElementById(id);
    el.href = value;
    el.innerText = value;
  }
}

// Download PDF and delete saved data
document.getElementById("downloadBtn").onclick = function() {
  const element = document.body;

  html2pdf().from(element).save("My_Resume.pdf").then(() => {
    // Delete saved personal data after download
    localStorage.removeItem("personal");
    alert("Personal data cleared from storage after download.");
  });
};
</script>

</body>
</html>
