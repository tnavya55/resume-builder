<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Builder - Personal</title>

  <!-- Font Awesome 4.7 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- Your CSS -->
 <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <i class="fa fa-bars"></i>
  <h2>Resume Builder</h2>
  <button class="login">LOGIN</button>
</div>

<!-- CARD -->
<div class="card">
  <h3>Personal Details</h3>

  <div class="form-grid">
    <div class="input-box">
      <input type="text" id="fname" placeholder="First Name *">
    </div>

    <div class="input-box">
      <input type="text" id="lname" placeholder="Last Name *">
    </div>

    <div class="input-box">
      <input type="email" id="email" placeholder="Email *">
      <i class="fa fa-envelope"></i>
    </div>

    <div class="input-box">
      <input type="text" id="phone" placeholder="Phone Number">
      <i class="fa fa-phone"></i>
    </div>

    <div class="input-box">
      <input type="text" id="website" placeholder="Your Website">
      <i class="fa fa-globe"></i>
    </div>

    <div class="input-box">
      <input type="text" id="github" placeholder="GitHub">
      <i class="fa fa-github"></i>
    </div>

    <div class="input-box">
      <input type="text" id="linkedin" placeholder="LinkedIn">
      <i class="fa fa-linkedin"></i>
    </div>

    <div class="input-box">
      <input type="text" id="twitter" placeholder="Twitter">
      <i class="fa fa-twitter"></i>
    </div>

    <div class="input-box">
      <input type="text" id="facebook" placeholder="Facebook">
      <i class="fa fa-facebook"></i>
    </div>

    <div class="input-box">
      <input type="text" id="instagram" placeholder="Instagram">
      <i class="fa fa-instagram"></i>
    </div>
  </div>

  <div class="buttons">
    <!-- Optional BACK button can go to home or index -->
    <button class="back" type="button" onclick="window.history.back()">‹ BACK</button>
    <button class="next" type="button">NEXT ›</button>
  </div>

  <p class="page">Page 1</p>
</div>

<script>
  // Load saved personal data from localStorage
  window.onload = function () {
    const data = JSON.parse(localStorage.getItem("personal"));
    if (data) {
      document.getElementById("fname").value = data.fname || "";
      document.getElementById("lname").value = data.lname || "";
      document.getElementById("email").value = data.email || "";
      document.getElementById("phone").value = data.phone || "";
      document.getElementById("website").value = data.website || "";
      document.getElementById("github").value = data.github || "";
      document.getElementById("linkedin").value = data.linkedin || "";
      document.getElementById("twitter").value = data.twitter || "";
      document.getElementById("facebook").value = data.facebook || "";
      document.getElementById("instagram").value = data.instagram || "";
    }
  };

  // Save personal data and go to Education page
  document.querySelector(".next").onclick = function () {
    const personalData = {
      fname: document.getElementById("fname").value,
      lname: document.getElementById("lname").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      website: document.getElementById("website").value,
      github: document.getElementById("github").value,
      linkedin: document.getElementById("linkedin").value,
      twitter: document.getElementById("twitter").value,
      facebook: document.getElementById("facebook").value,
      instagram: document.getElementById("instagram").value
    };

    localStorage.setItem("index", JSON.stringify(personalData));

    // Navigate to Education page
    window.location.href = "education.html";
  };
</script>

</body>

</html>
